# Render Blueprint for the API + Telegram bot.
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are asked for during setup and never stored in git.
services:
  - type: web
    name: weeee-api
    runtime: node
    region: singapore # closest Render region to Cambodia
    plan: free # free sleeps after 15 min idle (bot goes quiet too) — use "starter" for a live shop
    buildCommand: npm ci --workspace=server --omit=dev
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false # https://<miniapp project>.pages.dev
      - key: CORS_ORIGINS
        sync: false # https://<miniapp>.pages.dev,https://<admin>.pages.dev
      - key: SHOP_UTC_OFFSET_MINUTES
        value: "420"
      - key: BOT_POLLING
        value: "true"
      - key: KHQR_BAKONG_ACCOUNT_ID
        sync: false # e.g. yourname@aclb — leave empty for cash only
      - key: KHQR_MERCHANT_NAME
        value: Weeee Cafe
      - key: KHQR_MERCHANT_CITY
        value: Phnom Penh
      - key: KHQR_BAKONG_TOKEN
        sync: false # Bakong Open API token — confirms KHQR payments automatically
      - key: R2_ACCOUNT_ID
        sync: false # Cloudflare account ID (leave the R2 settings empty to turn uploads off)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false # e.g. https://pub-xxxx.r2.dev
